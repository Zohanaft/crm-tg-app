    <!-- Calendar -->
    <rect x="10" y="18" width="36" height="36" rx="8"/>
    <line x1="10" y1="30" x2="46" y2="30"/>
    <line x1="20" y1="12" x2="20" y2="20"/>
    <line x1="36" y1="12" x2="36" y2="20"/>

